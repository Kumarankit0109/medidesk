name: MediDesk CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build MediDesk with Maven
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/kumarankit0109/medidesk:latest
            ghcr.io/kumarankit0109/medidesk:${{ github.sha }}

  deploy-to-ec2:
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check GitHub OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, base64

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "bearer "
                  + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for name in ("iss", "aud", "sub"):
              print(f"{name}: {claims.get(name)}")
          PY

      - name: Get temporary AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Update MediDesk on EC2 through Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          command_id=$(aws ssm send-command \
            --instance-ids i-07680f53e45152472 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sudo -u ec2-user -H env DOCKER_CONFIG=/home/ec2-user/.docker docker compose -f /home/ec2-user/medidesk/docker-compose.yml pull app","sudo -u ec2-user -H env DOCKER_CONFIG=/home/ec2-user/.docker docker compose -f /home/ec2-user/medidesk/docker-compose.yml up -d app"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Systems Manager command: $command_id"

          for attempt in {1..36}; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-07680f53e45152472 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            if [ "$status" = "Success" ]; then
              echo "MediDesk deployment succeeded."
              exit 0
            fi

            if [[ "$status" == "Failed" || "$status" == "Cancelled" || "$status" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id i-07680f53e45152472 \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json || true
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for the EC2 deployment command."
          exit 1