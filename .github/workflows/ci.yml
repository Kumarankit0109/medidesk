name: MediDesk CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build MediDesk with Maven
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/kumarankit0109/medidesk:latest
            ghcr.io/kumarankit0109/medidesk:${{ github.sha }}

  deploy-to-ec2:
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check GitHub OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import base64

          parts = urllib.parse.urlsplit(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
          query = [
              (key, value)
              for key, value in urllib.parse.parse_qsl(parts.query)
              if key != "audience"
          ]
          query.append(("audience", "sts.amazonaws.com"))

          url = urllib.parse.urlunsplit((
              parts.scheme,
              parts.netloc,
              parts.path,
              urllib.parse.urlencode(query),
              parts.fragment,
          ))

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": (
                      "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
                  )
              },
          )

          with urllib.request.urlopen(request, timeout=15) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("iss:", claims.get("iss"))
          print("aud:", claims.get("aud"))
          print("sub:", claims.get("sub"))
          PY

      - name: Get temporary AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Update MediDesk on EC2 through Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          command_id=$(aws ssm send-command \
            --instance-ids i-07680f53e45152472 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sudo -u ec2-user -H bash -lc \"cd /home/ec2-user/medidesk && docker compose pull app && docker compose up -d app\""]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Systems Manager command sent."

          for attempt in {1..36}; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-07680f53e45152472 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            if [ "$status" = "Success" ]; then
              echo "MediDesk deployment succeeded."
              exit 0
            fi

            if [[ "$status" == "Failed" || "$status" == "Cancelled" || "$status" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id i-07680f53e45152472 \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json || true
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for the EC2 deployment command."
          exit 1